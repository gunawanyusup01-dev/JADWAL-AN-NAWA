
name: Build Jadwal An-Nawa APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JadwalAnNawa-GitHub-Ready.zip'
      - '*.png'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP proyek tidak ditemukan"
            exit 1
          fi
          mkdir -p _project
          unzip -q "$ZIP_FILE" -d _project
          PROJECT_DIR=$(find _project -name settings.gradle -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Folder proyek Android tidak ditemukan"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .
          rm -rf _project

      - name: Install AN-NAWA logo
        run: |
          LOGO="./file_000000009cd472069b7f07ac246397f7.png"
          if [ -n "$LOGO" ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            cp "$LOGO" app/src/main/res/drawable-nodpi/logo_annawa.png
            sed -i 's|@drawable/ic_annawa|@drawable/logo_annawa|g' app/src/main/AndroidManifest.xml
          else
            echo "Logo PNG tidak ditemukan di halaman utama repositori"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false




      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jadwal-An-Nawa-APK
          path: app/build/outputs/apk/debug/app-debug.apk
